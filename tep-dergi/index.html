<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEP | Dijital broşür</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#101e35;color:#f4f7fc;font:16px system-ui,sans-serif;overflow:hidden}
main{height:100dvh;display:grid;grid-template-rows:auto minmax(260px,1fr) auto;gap:10px;padding:12px 16px}
header,nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;width:100%;max-width:1120px;margin:auto}
strong{letter-spacing:.05em}
header a{color:#cddbf0;font-size:.9rem}
.stage{position:relative;min-width:0;min-height:0;user-select:none;-webkit-user-select:none}
#flip{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
#flip.grab{cursor:grab}
#flip.grabbing{cursor:grabbing}
#hot{position:absolute;inset:0;pointer-events:none}
.hotspot{position:absolute;border-radius:4px;pointer-events:auto}
.hotspot:hover{background:#ed82261f}
.hotspot:focus-visible{outline:3px solid #e9782d;background:#ed82263b}
nav{justify-content:center}
button,select{border:1px solid #586983;border-radius:8px;background:#253653;color:#fff;font:inherit;padding:8px 11px;min-height:42px}
button:not(:disabled){cursor:pointer}
button:disabled{opacity:.46}
button:hover:not(:disabled){background:#3c5172}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #ffa35b;outline-offset:3px}
#status{font-size:.86rem;min-width:5.4em;text-align:center;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:660px){main{padding:10px 8px}button,select{font-size:.84rem;padding:7px}#status{min-width:auto}}
</style>
</head>
<body>
<main>
<header><strong>TEP · Dijital broşür</strong><a href="tep-brosur.pdf?v=6" target="_blank" rel="noopener">PDF’yi aç ↗</a></header>
<div class="stage" id="stage">
 <canvas id="flip" role="img" aria-label="TEP broşürü"></canvas>
 <div id="hot"></div>
</div>
<nav aria-label="Sayfa gezintisi">
 <button id="prev" type="button" aria-label="Önceki sayfa">←</button>
 <span id="status" role="status"></span>
 <button id="next" type="button" aria-label="Sonraki sayfa">→</button>
 <select id="jump" aria-label="Bölüme git"></select>
 <button id="full" type="button">Tam ekran</button>
</nav>
<p class="sr" id="desc" aria-live="polite"></p>
</main>
<script>
(() => {
'use strict';
/* ---------- İçerik ---------- */
const titles = ['Kapak','Program hakkında','Kademe seçimi','Öğretimin Temelleri','Gelişim Rotaları','Öğretme ve Öğrenme Araştırmaları','Takvim ve muafiyet','Başvuru ve bilgi'];
const links = [
  {page:7, label:'Detaylı bilgi: learn.ieu.edu.tr', href:'https://learn.ieu.edu.tr', x:8.3, y:69.2, w:25, h:3.2},
  {page:7, label:'Başvuru: my.ieu.edu.tr', href:'https://my.ieu.edu.tr/', x:4.6, y:74.2, w:42, h:7.4},
  {page:7, label:'TLC e-posta: tlc@ieu.edu.tr', href:'mailto:tlc@ieu.edu.tr', x:58, y:69.2, w:23, h:3.2},
  {page:7, label:'TLC telefon: 0 232 488 58 03', href:'tel:+902324885803', x:58, y:72.7, w:23, h:3.2}
];
const ASPECT = 1116 / 1579;            // sayfa genişlik / yükseklik
const url = i => 'sayfalar/' + String(i + 1).padStart(2, '0') + '.webp?v=6';

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const stage = $('#stage'), canvas = $('#flip'), ctx = canvas.getContext('2d');
const hot = $('#hot'), prev = $('#prev'), next = $('#next'), jump = $('#jump');
const status = $('#status'), full = $('#full'), desc = $('#desc');
const compact = matchMedia('(max-width: 660px)');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

const imgs = titles.map((_, i) => {
  const im = new Image();
  im.decoding = 'async';
  im.onload = () => kick();
  im.src = url(i);
  return im;
});
const ready = i => i != null && imgs[i].complete && imgs[i].naturalWidth > 0;
titles.forEach((t, i) => jump.add(new Option((i + 1) + ' · ' + t, i)));

/* ---------- Yardımcılar ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* ---------- Yerleşim ---------- */
let L = {W:0, H:0, pw:0, h:0, top:0, cx:0, spread:true};
let dpr = 1, spreads = [], cur = 0, spineX = 0;

function buildSpreads() {
  spreads = [];
  const n = titles.length;
  if (L.spread) {
    spreads.push([null, 0]);                       // kapak sağda tek
    for (let i = 1; i < n; i += 2) spreads.push([i, i + 1 < n ? i + 1 : null]);
  } else {
    for (let i = 0; i < n; i++) spreads.push([null, i]);
  }
}
const firstPage = s => spreads[s][0] ?? spreads[s][1];
const spreadOf = p => Math.max(0, spreads.findIndex(s => s.includes(p)));
const shiftOf = s => !L.spread ? 0 : s[0] == null ? -L.pw / 2 : s[1] == null ? L.pw / 2 : 0;

function layout() {
  const r = stage.getBoundingClientRect();
  const page = spreads.length ? firstPage(cur) : 0;
  const wasSpread = L.spread, hadSpreads = spreads.length > 0;
  L.spread = !compact.matches;
  const pad = L.spread ? 18 : 6;
  const h = Math.max(80, Math.min(r.height - pad * 2, (r.width - pad * 2) / (L.spread ? 2 * ASPECT : ASPECT)));
  Object.assign(L, {W:r.width, H:r.height, h, pw:h * ASPECT, top:(r.height - h) / 2, cx:r.width / 2});
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  if (!hadSpreads || wasSpread !== L.spread) {
    buildSpreads();
    cur = spreadOf(page);
    T = null;
    updateUI();
  }
  kick();
}

/* ---------- Sayfa çevirme durumu ----------
   Tüm geometri "ileri" yönlü sanal koordinatlarda: sırt x=0'da,
   sağ sayfa [0,pw], sol sayfa [-pw,0]. Tek bir yaprak (sheet) A ile B
   açılımı arasında dönüyor; P, yaprağın serbest köşesinin konumu.
   P = (pw,cy) → yaprak sağda düz;  P = (-pw,cy) → yaprak solda düz. */
let T = null;

function makeTurn(a, b, cy, fromB) {
  const x = fromB ? -L.pw : L.pw;
  return {a, b, cy, fromB, P:{x, y:cy}, target:{x, y:cy}, start:{x, y:cy}, phase:'peek'};
}
const progress = P => clamp((L.pw - P.x) / (2 * L.pw), 0, 1);

/* Kâğıt yırtılmasın: köşe sırta olan uzaklıklarla sınırlı. */
function constrain(P, cy) {
  const {pw, h} = L;
  const sg = cy === 0 ? 1 : -1;
  let x = P.x, y = P.y;
  const c = clamp(x / pw, -1, 1);
  const lift = .05 * h * Math.sqrt(1 - c * c);       // ortada hafif kalkış
  if ((y - cy) * sg < lift) y = cy + sg * lift;
  let dx = x, dy = y - cy, d = Math.hypot(dx, dy);
  if (d > pw) { x = dx * pw / d; y = cy + dy * pw / d; }
  const cy2 = h - cy, R = Math.hypot(pw, h);
  dx = x; dy = y - cy2; d = Math.hypot(dx, dy);
  if (d > R) { x = dx * R / d; y = cy2 + dy * R / d; }
  return {x, y};
}

function clipPoly(pts, f) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const fa = f(a), fb = f(b);
    if (fa >= 0) out.push(a);
    if ((fa >= 0) !== (fb >= 0)) {
      const t = fa / (fa - fb);
      out.push({x:a.x + (b.x - a.x) * t, y:a.y + (b.y - a.y) * t});
    }
  }
  return out;
}
function path(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
}

/* ---------- Çizim ---------- */
function drawPage(i, x, side) {
  const {pw, h} = L;
  if (!ready(i)) {
    ctx.fillStyle = '#f2f1ec';
    ctx.fillRect(x, 0, pw, h);
  } else {
    ctx.drawImage(imgs[i], x, 0, pw, h);
  }
  // cilt (sırt) gölgesi — kâğıdın kendi dokusu gibi her yerde onunla gider
  const gw = pw * (L.spread ? .09 : .05);
  const bx = side === 'L' ? x + pw : x;
  const g = ctx.createLinearGradient(bx, 0, side === 'L' ? bx - gw : bx + gw, 0);
  g.addColorStop(0, 'rgba(20,24,36,' + (L.spread ? .22 : .12) + ')');
  g.addColorStop(.35, 'rgba(20,24,36,.07)');
  g.addColorStop(1, 'rgba(20,24,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(side === 'L' ? bx - gw : bx, 0, gw, h);
}
function dropShadow(fn, alpha = .42) {
  ctx.save();
  ctx.shadowColor = 'rgba(4,10,24,' + alpha + ')';
  ctx.shadowBlur = 34 * dpr;
  ctx.shadowOffsetY = 12 * dpr;
  ctx.fillStyle = '#fff';
  fn();
  ctx.fill();
  ctx.restore();
}

function draw() {
  const {pw, h, top} = L;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, L.W, L.H);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  const A = spreads[T ? T.a : cur], B = T ? spreads[T.b] : A;
  const p = T ? progress(T.P) : 0;
  spineX = L.spread ? L.cx + lerp(shiftOf(A), shiftOf(B), p) : L.cx - pw / 2;
  ctx.translate(spineX, top);

  const leftImg = A[0];
  const rightImg = T ? B[1] : A[1];
  const rect = [{x:0,y:0},{x:pw,y:0},{x:pw,y:h},{x:0,y:h}];

  // sabit sayfalar
  if (leftImg != null) { dropShadow(() => { ctx.beginPath(); ctx.rect(-pw, 0, pw, h); }); drawPage(leftImg, -pw, 'L'); }
  if (rightImg != null) { dropShadow(() => { ctx.beginPath(); ctx.rect(0, 0, pw, h); }); drawPage(rightImg, 0, 'R'); }

  positionHotspots(A);
  if (!T) return;

  const front = A[1], back = B[0];
  const C0 = {x:pw, y:T.cy}, P = T.P;
  const dx = P.x - C0.x, dy = P.y - C0.y, d = Math.hypot(dx, dy);
  if (d < .5) {                                       // yaprak düz duruyor
    if (front != null) drawPage(front, 0, 'R');
    return;
  }
  const n = {x:dx / d, y:dy / d};
  const M = {x:(P.x + C0.x) / 2, y:(P.y + C0.y) / 2};
  const side = q => (q.x - M.x) * n.x + (q.y - M.y) * n.y;
  const rem = clipPoly(rect, side);                   // sırta bağlı kalan kısım
  const src = clipPoly(rect, q => -side(q));          // katlanan kısım (yaprak üzerinde)
  const flap = src.map(q => { const s = side(q); return {x:q.x - 2 * s * n.x, y:q.y - 2 * s * n.y}; });
  const k = p < .5 ? 1 : Math.min(1, 2.2 * Math.sin(Math.PI * p));   // eğrilik şiddeti

  // 1) alttaki sayfaya düşen katlanma gölgesi
  if (rightImg != null && src.length > 2) {
    const len = pw * .32;
    ctx.save(); path(src); ctx.clip();
    const g = ctx.createLinearGradient(M.x, M.y, M.x - n.x * len, M.y - n.y * len);
    g.addColorStop(0, 'rgba(8,12,22,' + .42 * k + ')');
    g.addColorStop(.25, 'rgba(8,12,22,' + .16 * k + ')');
    g.addColorStop(1, 'rgba(8,12,22,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, pw, h);
    ctx.restore();
  }

  // 2) yaprağın ön yüzünün kalan kısmı
  if (front != null && rem.length > 2) {
    if (rightImg == null) dropShadow(() => path(rem), .35);
    ctx.save(); path(rem); ctx.clip();
    drawPage(front, 0, 'R');
    ctx.restore();
  }

  // 3) katlanan kanat (arka yüz)
  if (flap.length > 2) {
    ctx.save();
    ctx.shadowColor = 'rgba(4,10,24,' + .5 * k + ')';
    ctx.shadowBlur = (12 + 26 * k) * dpr;
    ctx.shadowOffsetX = -n.x * 6 * k * dpr;
    ctx.shadowOffsetY = 4 * k * dpr;
    ctx.fillStyle = '#fbfaf6';
    path(flap); ctx.fill();
    ctx.restore();

    // arka yüz görüntüsü: yaprak noktası q → yansıma; arka sayfa u = pw - q.x
    const h11 = 1 - 2 * n.x * n.x, h12 = -2 * n.x * n.y, h22 = 1 - 2 * n.y * n.y;
    const nm = n.x * M.x + n.y * M.y, tx = 2 * n.x * nm, ty = 2 * n.y * nm;
    ctx.save(); path(flap); ctx.clip();
    ctx.transform(-h11, -h12, h12, h22, h11 * pw + tx, h12 * pw + ty);
    if (back != null) {
      drawPage(back, 0, 'L');
    } else if (front != null) {                         // tek sayfa görünümü: kâğıdın arkası
      ctx.save(); ctx.translate(pw, 0); ctx.scale(-1, 1);
      if (ready(front)) ctx.drawImage(imgs[front], 0, 0, pw, h);
      ctx.restore();
      ctx.fillStyle = 'rgba(251,250,246,.88)';
      ctx.fillRect(0, 0, pw, h);
    }
    ctx.restore();

    // kanat üzerindeki kıvrım ışığı
    let G = 1;
    for (const v of flap) G = Math.max(G, side(v));
    const st = v => Math.min(1, v / G);
    ctx.save(); path(flap); ctx.clip();
    const g = ctx.createLinearGradient(M.x, M.y, M.x + n.x * G, M.y + n.y * G);
    g.addColorStop(0, 'rgba(10,14,26,' + .32 * k + ')');
    g.addColorStop(st(pw * .025), 'rgba(10,14,26,' + .12 * k + ')');
    g.addColorStop(st(pw * .12), 'rgba(255,255,255,' + .22 * k + ')');
    g.addColorStop(st(pw * .38), 'rgba(255,255,255,0)');
    g.addColorStop(1, 'rgba(10,14,26,' + .08 * k + ')');
    ctx.fillStyle = g;
    ctx.fillRect(-pw * 2, -h, pw * 4, h * 3);
    ctx.restore();
  }
}

/* ---------- Bağlantı alanları ---------- */
const hotEls = links.map(item => {
  const a = document.createElement('a');
  a.className = 'hotspot'; a.href = item.href;
  if (/^https?:/.test(item.href)) { a.target = '_blank'; a.rel = 'noopener'; }
  a.setAttribute('aria-label', item.label);
  a.hidden = true;
  hot.append(a);
  return a;
});
function positionHotspots(A) {
  links.forEach((item, i) => {
    const el = hotEls[i];
    const slot = T ? -1 : A.indexOf(item.page);
    if (slot < 0) { el.hidden = true; return; }
    const x0 = spineX + (slot === 0 ? -L.pw : 0);
    el.hidden = false;
    Object.assign(el.style, {
      left:x0 + L.pw * item.x / 100 + 'px', top:L.top + L.h * item.y / 100 + 'px',
      width:L.pw * item.w / 100 + 'px', height:L.h * item.h / 100 + 'px'
    });
  });
}

/* ---------- Animasyon döngüsü ---------- */
let raf = 0, lastT = 0;
function kick() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(now) {
  raf = 0;
  const dt = Math.min(48, now - lastT); lastT = now;
  if (T) step(now, dt);
  draw();
  if (T) raf = requestAnimationFrame(frame);
}
function step(now, dt) {
  if (T.phase === 'anim') {
    const a = T.anim;
    const t = clamp((now - a.t0) / a.dur, 0, 1), e = a.ease(t);
    const sg = T.cy === 0 ? 1 : -1;
    const y = T.cy + (a.y0 - T.cy) * (1 - e) + sg * a.lift * Math.sin(Math.PI * e);
    T.P = constrain({x:lerp(a.x0, a.xe, e), y}, T.cy);
    if (t >= 1) finishTurn();
    return;
  }
  const tau = T.phase === 'drag' ? 38 : 70;          // fareyi takip yumuşaklığı (ms)
  const f = 1 - Math.exp(-dt / tau);
  T.P = constrain({x:lerp(T.P.x, T.target.x, f), y:lerp(T.P.y, T.target.y, f)}, T.cy);
  if (T.phase === 'peek' && T.leaving && Math.hypot(T.P.x - T.start.x, T.P.y - T.start.y) < .6) T = null;
}
function animateTo(toB, {lift = 0, ease = easeOut, dur} = {}) {
  const xe = toB ? -L.pw : L.pw;
  const span = Math.abs(xe - T.P.x) / (2 * L.pw);
  T.phase = 'anim';
  T.anim = {t0:performance.now(), x0:T.P.x, y0:T.P.y, xe, lift, ease,
            dur:dur ?? clamp(span * (L.spread ? 950 : 700), 220, 950)};
  kick();
}
function finishTurn() {
  if (!T) return;
  cur = T.anim && T.anim.xe < 0 ? T.b : T.a;
  T = null;
  updateUI();
}

/* ---------- Programatik çevirme (düğme, klavye, menü) ---------- */
function turnTo(target, cy) {
  target = clamp(target, 0, spreads.length - 1);
  if (T && T.phase === 'anim') finishTurn();
  if (target === cur) return;
  if (reduce.matches) { T = null; cur = target; updateUI(); kick(); return; }
  const fwd = target > cur;
  T = makeTurn(fwd ? cur : target, fwd ? target : cur, cy ?? L.h, !fwd);
  animateTo(fwd, {lift:L.h * .1, ease:easeInOut, dur:L.spread ? 900 : 680});
  updateUI(target);
}
const advance = dir => turnTo(cur + dir);

/* ---------- Fare / dokunma ---------- */
function local(e) {
  const r = canvas.getBoundingClientRect();
  return {x:e.clientX - r.left - spineX, y:e.clientY - r.top - L.top};
}
function zone(q) {
  const {pw, h} = L;
  const m = 14;
  if (q.y < -m || q.y > h + m) return null;
  const cs = Math.min(pw * .26, 150);
  const cy = q.y < h / 2 ? 0 : h;
  if (L.spread) {
    if (q.x >= 0 && q.x <= pw + m && cur < spreads.length - 1 && spreads[cur][1] != null)
      return {dir:1, cy, corner:Math.hypot(q.x - pw, q.y - cy) < cs};
    if (q.x < 0 && q.x >= -pw - m && cur > 0 && spreads[cur][0] != null)
      return {dir:-1, cy, corner:Math.hypot(q.x + pw, q.y - cy) < cs};
    return null;
  }
  if (q.x < -m || q.x > pw + m) return null;
  return {dir:0, cy, corner:cur < spreads.length - 1 && Math.hypot(q.x - pw, q.y - cy) < cs, single:true};
}
function peekTarget(q, C) {
  let vx = q.x - C.x, vy = q.y - C.y;
  const max = L.pw * .22, d = Math.hypot(vx, vy);
  if (d > max) { vx *= max / d; vy *= max / d; }
  const inX = C.x > 0 ? -1 : 1, inY = C.y === 0 ? 1 : -1, min = L.pw * .05;
  return {x:C.x + vx + inX * min, y:C.y + vy + inY * min};
}
function ensureTurn(dir, cy) {
  const fromB = dir < 0;
  const a = fromB ? cur - 1 : cur, b = a + 1;
  if (T && T.phase !== 'anim' && T.a === a && T.b === b && T.cy === cy) { T.leaving = false; return T; }
  T = makeTurn(a, b, cy, fromB);
  return T;
}

let drag = null, interacted = false;
canvas.addEventListener('pointermove', e => {
  const q = local(e);
  if (drag && e.pointerId === drag.id) { onDragMove(e, q); return; }
  if (e.pointerType !== 'mouse' || (T && T.phase === 'anim')) return;
  const z = zone(q);
  canvas.className = z ? 'grab' : '';
  const dir = z && (z.single ? 1 : z.dir);
  if (z && z.corner && !reduce.matches) {
    interacted = true;
    const t = ensureTurn(dir, z.cy);
    t.phase = 'peek';
    t.target = constrain(peekTarget(q, t.start), t.cy);
    kick();
  } else if (T && T.phase === 'peek') {
    T.leaving = true; T.target = {...T.start}; kick();
  }
});
canvas.addEventListener('pointerleave', () => {
  if (!drag && T && T.phase === 'peek') { T.leaving = true; T.target = {...T.start}; kick(); }
  if (!drag) canvas.className = '';
});
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || drag) return;
  if (T && T.phase === 'anim') finishTurn();
  const q = local(e), z = zone(q);
  if (!z) return;
  interacted = true;
  drag = {id:e.pointerId, s:q, last:q, lt:performance.now(), t0:performance.now(), vx:0, z, moved:false, started:false};
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  if (!z.single && !reduce.matches) beginDrag(z.dir, z.cy, q);
});
function beginDrag(dir, cy, q) {
  const t = ensureTurn(dir, cy);
  t.phase = 'drag';
  drag.P0 = {...t.P};
  drag.s = q;
  drag.kx = L.spread ? 1 : 2;                       // tek sayfada iki kat yol
  drag.started = true;
  canvas.className = 'grabbing';
  kick();
}
function onDragMove(e, q) {
  const now = performance.now(), dt = Math.max(1, now - drag.lt);
  drag.vx = drag.vx * .7 + ((q.x - drag.last.x) / dt) * .3;
  drag.last = q; drag.lt = now;
  if (!drag.moved && Math.hypot(q.x - drag.s.x, q.y - drag.s.y) > 6) drag.moved = true;
  if (!drag.started) {
    if (!drag.moved || reduce.matches) return;
    const dx = q.x - drag.s.x;
    const dir = dx < 0 ? 1 : -1;
    if ((dir > 0 && cur >= spreads.length - 1) || (dir < 0 && cur <= 0)) return;
    beginDrag(dir, drag.z.cy, drag.s);
  }
  if (!T || T.phase !== 'drag') return;
  T.target = constrain({x:drag.P0.x + drag.kx * (q.x - drag.s.x), y:drag.P0.y + (q.y - drag.s.y)}, T.cy);
}
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  canvas.className = '';
  const quick = !d.moved && performance.now() - d.t0 < 600;
  if (quick && !cancelled) {                         // tıklama: sayfayı çevir
    const dir = d.z.single ? (d.s.x > L.pw / 2 ? 1 : -1) : d.z.dir;
    if (T && T.phase === 'drag' && !reduce.matches) {
      animateTo(dir > 0, {lift:L.h * .1, ease:easeInOut, dur:L.spread ? 900 : 680});
      updateUI(dir > 0 ? T.b : T.a);
    } else {
      T = null; turnTo(cur + dir, d.z.cy);
    }
    return;
  }
  if (!T || T.phase !== 'drag') return;
  const p = progress(T.P);
  const v = d.vx;                                     // px/ms, negatif = sola
  let toB = p > .5;
  if (v < -.35) toB = true;
  if (v > .35) toB = false;
  if (cancelled) toB = p > .5;
  animateTo(toB);
  updateUI(toB ? T.b : T.a);
}
canvas.addEventListener('pointerup', e => endDrag(e, false));
canvas.addEventListener('pointercancel', e => endDrag(e, true));
canvas.addEventListener('lostpointercapture', e => endDrag(e, true));

/* ---------- Arayüz ---------- */
function updateUI(target = cur) {
  const s = spreads[target];
  const pages = s.filter(v => v != null);
  status.textContent = pages.map(v => v + 1).join('–') + ' / ' + titles.length;
  jump.value = pages[0];
  prev.disabled = target <= 0;
  next.disabled = target >= spreads.length - 1;
  const text = pages.map(v => (v + 1) + '. sayfa: ' + titles[v]).join(', ');
  canvas.setAttribute('aria-label', 'TEP broşürü — ' + text);
  desc.textContent = text;
}
prev.addEventListener('click', () => advance(-1));
next.addEventListener('click', () => advance(1));
jump.addEventListener('change', () => turnTo(spreadOf(Number(jump.value))));
document.addEventListener('keydown', e => {
  if (e.target.matches('select, input, textarea') || e.altKey || e.ctrlKey || e.metaKey) return;
  const map = {ArrowRight:1, PageDown:1, ArrowLeft:-1, PageUp:-1};
  if (e.key in map) { e.preventDefault(); advance(map[e.key]); }
  else if (e.key === 'Home') { e.preventDefault(); turnTo(0); }
  else if (e.key === 'End') { e.preventDefault(); turnTo(spreads.length - 1); }
});
full.hidden = !document.fullscreenEnabled;
full.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch { window.open(location.href, '_blank', 'noopener'); }
});
document.addEventListener('fullscreenchange', () => full.textContent = document.fullscreenElement ? 'Tam ekrandan çık' : 'Tam ekran');

new ResizeObserver(() => layout()).observe(stage);
compact.addEventListener('change', layout);
layout();

/* Açılışta kapağın köşesini hafifçe kaldırarak ipucu ver */
imgs[0].decode?.().catch(() => {}).finally(() => setTimeout(() => {
  if (interacted || T || reduce.matches || cur !== 0 || spreads.length < 2) return;
  const t = ensureTurn(1, L.h);
  t.phase = 'peek';
  t.target = constrain({x:L.pw * .8, y:L.h * .87}, L.h);
  kick();
  setTimeout(() => { if (T === t && T.phase === 'peek') { T.leaving = true; T.target = {...T.start}; kick(); } }, 850);
}, 900));
})();
</script>
</body>
